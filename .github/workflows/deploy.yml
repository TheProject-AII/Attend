name: HRIS Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hris-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy HRIS to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/ganbaru/hris-github
            git fetch origin main
            git reset --hard origin/main
            ./scripts/deploy.sh
