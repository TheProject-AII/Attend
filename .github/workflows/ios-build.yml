name: HRIS iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fe/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios:
    runs-on: macos-15

    defaults:
      run:
        working-directory: fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Archive iOS project
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/HRIS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create Unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/HRIS.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r HRIS-unsigned.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HRIS-Unsigned-IPA
          path: ${{ runner.temp }}/HRIS-unsigned.ipa
          retention-days: 7

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: HRIS-iOS-Archive
          path: ${{ runner.temp }}/HRIS.xcarchive
          if-no-files-found: error
          retention-days: 7